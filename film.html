<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- 撮影用ページ：検索エンジンに登録しない -->
<title>撮影モード ｜ 開かずの書庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;900&family=Special+Elite&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  /* 縦長 9:16 の舞台を画面の中央に置く。--u は舞台の幅の1% */
  :root { --bg: #07090c; --ink: #e9e4d8; --dim: #8d8a82; --accent: #e0b25a; --hot: #ff5a4a;
          --paper: #d9cdb2; --paper-ink: #2a241b; --red: #b3261e; --u: 4px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Noto Serif JP", serif; color: var(--ink); }
  .stage { position: relative; width: calc(var(--u) * 100); height: calc(var(--u) * 177.78); overflow: hidden; background: var(--bg); }
  #stars, #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
  .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2;
              background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(0,0,0,.7) 100%); }
  .layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .9s ease; }
  .layer.on { opacity: 1; }

  /* ① 冒頭：封印された書庫の金庫扉（モーショングラフィックス）
     すべての動きは Intro.update(t) が1コマごとに時間から計算する（録画しても音とずれない） */
  #intro { opacity: 1; z-index: 8; background: transparent; }   /* 扉の左右それぞれが背景を持つので、開くと奥の地球儀が見える */
  #intro.done { display: none; }
  #vault, #dust { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vault { overflow: visible; }
  .hook { position: absolute; left: 5%; right: 5%; top: 7.5%; z-index: 4; text-align: center; font-weight: 900;
          font-size: calc(var(--u) * 6.2); line-height: 1.65; letter-spacing: .1em; white-space: pre-line;
          text-shadow: 0 0 calc(var(--u) * 4) rgba(0,0,0,.95); }
  .hook .ch { display: inline-block; will-change: transform, opacity, filter; }
  .hud { position: absolute; z-index: 4; font-family: "Special Elite", monospace; color: var(--accent); letter-spacing: .18em; font-size: calc(var(--u) * 2.5); line-height: 1.7; }
  .hud.tl { left: 6%; top: 1.8%; opacity: .75; white-space: pre; font-size: calc(var(--u) * 2.3); }
  .hud.st { left: 0; right: 0; top: 76%; text-align: center; font-size: calc(var(--u) * 2.9); }
  .hud.st b { display: inline-block; width: calc(var(--u) * 2.2); height: calc(var(--u) * 3.2); margin: 0 calc(var(--u) * .5); vertical-align: -12%;
              border: 1px solid var(--accent); transition: background .15s, box-shadow .15s; }
  .hud.st b.on { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 calc(var(--u) * 2) var(--hot); }
  .hud.st .w { display: inline-block; min-width: 8em; text-align: left; margin-left: calc(var(--u) * 2); }
  .hud.st.open .w { color: var(--hot); }

  /* ② 照準と地名 */
  .reticle { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; opacity: 0; transition: opacity .8s; }
  .reticle.on { opacity: 1; }
  .reticle i { position: absolute; left: 50%; top: 50%; border: 1px solid rgba(233,220,188,.6); border-radius: 50%; transform: translate(-50%, -50%) scale(.4); transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
  .reticle.on i { transform: translate(-50%, -50%) scale(1); }
  .reticle i:nth-child(1) { width: calc(var(--u) * 22); height: calc(var(--u) * 22); }
  .reticle i:nth-child(2) { width: calc(var(--u) * 52); height: calc(var(--u) * 52); border-style: dashed; opacity: .6; }
  .reticle i:nth-child(3) { width: calc(var(--u) * 82); height: calc(var(--u) * 82); opacity: .35; }
  .reticle .box { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 14); height: calc(var(--u) * 14);
    transform: translate(-50%, -50%) scale(2.4) rotate(45deg); transition: transform 1.1s cubic-bezier(.3,1.5,.4,1) .3s; }
  .reticle.on .box { transform: translate(-50%, -50%); }
  .reticle .box b { position: absolute; width: 28%; height: 28%; border: 0 solid var(--hot); }
  .reticle .box b:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px; }
  .reticle .box b:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0; }
  .reticle .box b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px; }
  .reticle .box b:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
  .reticle .dot { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 2); height: calc(var(--u) * 2); margin: calc(var(--u) * -1) 0 0 calc(var(--u) * -1); border-radius: 50%; background: var(--hot); box-shadow: 0 0 12px var(--hot); }
  .tag { position: absolute; left: 50%; top: 42%; transform: translate(calc(var(--u) * 9), calc(var(--u) * -12)); z-index: 4;
         font-family: "Special Elite", monospace; font-size: calc(var(--u) * 2.6); letter-spacing: .2em; color: #ff8a7a; opacity: 0; transition: opacity .6s .9s; }
  .reticle.on ~ .tag { opacity: 1; }
  #place { top: 8%; text-align: center; }
  #place .p { font-weight: 900; font-size: calc(var(--u) * 7.6); letter-spacing: .3em; text-shadow: 0 2px 16px rgba(0,0,0,.9); }
  #place .s { margin-top: calc(var(--u) * 2); font-family: "Special Elite", monospace; font-size: calc(var(--u) * 3); color: var(--accent); letter-spacing: .15em; }

  /* ③ 事実（ファイルのラベル風）。TikTok等のボタンと重ならないよう、下20%・右15%を避ける */
  /* 事実の札：同じ場所に1枚ずつ。左から滑り込み → 右へ滑り去り → 次の札が入る */
  #facts { top: auto; bottom: 22%; left: 11%; right: 11%; height: calc(var(--u) * 22); opacity: 1; overflow: visible; }   /* 左右対称で真ん中に */
  .fact { position: absolute; left: 0; right: 0; bottom: 0; text-align: center;
          background: var(--paper); color: var(--paper-ink); padding: calc(var(--u) * 2.6) calc(var(--u) * 3.6);
          font-size: calc(var(--u) * 4.4); font-weight: 900; line-height: 1.5; letter-spacing: .04em;
          box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.6), calc(var(--u) * -.9) 0 0 var(--red);
          opacity: 0; transform: translateX(calc(var(--u) * -95)) rotate(-4deg);
          transition: opacity .35s ease, transform .75s cubic-bezier(.16,1,.3,1); }
  .fact.on { opacity: 1; transform: rotate(-.6deg); }
  .fact.out { opacity: 0; transform: translateX(calc(var(--u) * 110)) rotate(3deg);
              transition: opacity .45s ease .15s, transform .6s cubic-bezier(.7,0,.84,0); }
  .fact small { display: block; font-family: "Special Elite", monospace; font-weight: 400; font-size: calc(var(--u) * 2.4); letter-spacing: .12em; opacity: .6; }

  /* 60秒版：年表（下から積み重なる） */
  #tl { top: auto; bottom: 22%; left: 7%; right: 16%; height: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); opacity: 1; }
  .tl { display: flex; gap: calc(var(--u) * 3); align-items: baseline; background: rgba(7,9,12,.78); border-left: calc(var(--u) * .8) solid var(--accent);
        padding: calc(var(--u) * 1.8) calc(var(--u) * 3); font-size: calc(var(--u) * 3.9); font-weight: 900; line-height: 1.45;
        opacity: 0; transform: translateY(calc(var(--u) * 4)); transition: opacity .5s ease, transform .7s cubic-bezier(.2,.9,.25,1.1); }
  .tl.on { opacity: 1; transform: none; }
  .tl.dead { border-left-color: var(--hot); }
  .tl.dead .t { color: #ffb4a8; }
  .tl .y { flex: none; font-family: "Special Elite", monospace; font-weight: 400; font-size: calc(var(--u) * 3.2); color: var(--accent); }
  .tl.dead .y { color: var(--hot); }
  .tl.gone { opacity: 0; transform: translateY(calc(var(--u) * -3)); }

  /* 60秒版：古い写真 */
  #photo { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 6; }
  .print { width: 84%; background: #e9e1cf; padding: calc(var(--u) * 2.4) calc(var(--u) * 2.4) calc(var(--u) * 6); transform: rotate(-2deg) scale(.96);
           box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0,0,0,.8); transition: transform 6s ease-out; }
  #photo.on .print { transform: rotate(-1deg) scale(1.02); }
  .print img { display: block; width: 100%; filter: sepia(.35) contrast(1.05); }
  .print .cap { margin-top: calc(var(--u) * 2.4); color: var(--paper-ink); font-size: calc(var(--u) * 3.8); font-weight: 900; text-align: center; }
  .print .cr { margin-top: calc(var(--u) * 1); color: #6e6455; font-size: calc(var(--u) * 2.2); text-align: center; line-height: 1.5; }

  /* 60秒版：考察（3つの説） */
  #hypos { background: rgba(0,0,0,.66); z-index: 6; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 3.4); padding: 0 8% 0 8%; }
  #hypos .hd { font-family: "Special Elite", monospace; font-size: calc(var(--u) * 3); letter-spacing: .3em; color: var(--accent); text-align: center; margin-bottom: calc(var(--u) * 1); }
  .hy { position: relative; background: var(--paper); color: var(--paper-ink); padding: calc(var(--u) * 3) calc(var(--u) * 4);
        box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.6); opacity: 0; transform: translateX(calc(var(--u) * 10)) rotate(1deg);
        transition: opacity .5s ease, transform .7s cubic-bezier(.2,.9,.25,1.1); }
  .hy.on { opacity: 1; transform: rotate(-.6deg); }
  .hy h3 { margin: 0 0 calc(var(--u) * 1); font-size: calc(var(--u) * 4.8); font-weight: 900; }
  .hy p { margin: 0; font-size: calc(var(--u) * 3.3); line-height: 1.6; font-weight: 600; opacity: .8; }
  .hy .lv { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 2.6); font-size: calc(var(--u) * 3); font-weight: 900; letter-spacing: .1em;
            border: calc(var(--u) * .5) solid currentColor; padding: 0 calc(var(--u) * 1.4); transform: rotate(-8deg) scale(2); opacity: 0;
            transition: transform .3s cubic-bezier(.3,1.6,.5,1) .55s, opacity .15s .55s; }
  .hy.on .lv { transform: rotate(-8deg); opacity: .9; }
  .lv.low { color: var(--red); } .lv.mid { color: #8a5a12; } .lv.ok { color: #2f5d3a; }

  /* 60秒版：ひとこと（記事の考察の核心） */
  #musing { background: rgba(0,0,0,.82); z-index: 6; display: flex; align-items: center; justify-content: center; padding: 0 10%; }
  #musing p { margin: 0; font-size: calc(var(--u) * 4.5); font-weight: 600; line-height: 1.9; letter-spacing: .06em; text-align: center; white-space: pre-line; }

  /* ④ 未解決の問い */
  #question { background: rgba(0,0,0,.78); display: flex; align-items: center; justify-content: center; z-index: 6; }
  .qcard { position: relative; width: 82%; background: var(--paper); color: var(--paper-ink); padding: calc(var(--u) * 7) calc(var(--u) * 6) calc(var(--u) * 6);
           box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0,0,0,.7); transform: scale(.94) rotate(1deg); transition: transform 1s cubic-bezier(.2,.9,.25,1.1); }
  #question.on .qcard { transform: rotate(-.8deg); }
  .qcard .lb { font-family: "Special Elite", monospace; font-size: calc(var(--u) * 2.6); letter-spacing: .25em; color: var(--red); }
  .qcard .q { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 4.9); font-weight: 900; line-height: 1.75; white-space: pre-line; }
  .qcard .stamp { position: absolute; right: calc(var(--u) * 4); top: calc(var(--u) * -4); border: calc(var(--u) * .8) solid var(--red); color: var(--red);
                  padding: calc(var(--u) * .6) calc(var(--u) * 2.4); font-weight: 900; font-size: calc(var(--u) * 5); letter-spacing: .15em;
                  background: rgba(217,205,178,.9); transform: rotate(-10deg) scale(2.2); opacity: 0; transition: transform .35s cubic-bezier(.3,1.6,.5,1) .7s, opacity .2s .7s; }
  #question.on .stamp { transform: rotate(-10deg); opacity: .9; }
  .qcard .no { margin-top: calc(var(--u) * 5); font-family: "Special Elite", monospace; font-size: calc(var(--u) * 2.6); opacity: .6; letter-spacing: .1em; }

  /* ⑤ ロゴ */
  #outro { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3); z-index: 7; }
  #outro .t { font-weight: 900; font-size: calc(var(--u) * 9); letter-spacing: .3em; }
  #outro .r { font-family: "Special Elite", monospace; font-size: calc(var(--u) * 3); letter-spacing: .45em; color: var(--accent); }
  #outro .c { margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 3.4); color: var(--dim); letter-spacing: .2em; }

  /* 撮影開始の案内（撮影中は消える） */
  #start { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.6); }
  #start .box { text-align: center; padding: 24px; max-width: 360px; }
  #start h1 { font-size: 18px; letter-spacing: .2em; margin: 0 0 6px; }
  #start p { font-size: 12px; line-height: 1.9; color: var(--dim); margin: 0 0 16px; }
  #start select, #start button { font: 600 14px "Noto Serif JP", serif; letter-spacing: .1em; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
  #start select { background: #111; color: var(--ink); border: 1px solid #333; margin-bottom: 10px; width: 100%; }
  #start .snd { display: block; font-size: 12px; color: var(--ink); margin: 0 0 12px; letter-spacing: .1em; cursor: pointer; }
  #start .snd input { vertical-align: -2px; margin-right: 6px; }
  #start button { background: var(--ink); color: #111; border: 0; width: 100%; }
  #again { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: none; font: 12px "Noto Serif JP", serif; padding: 6px 12px;
           background: #111; color: var(--dim); border: 1px solid #333; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="stars"></canvas>
  <div id="map"></div>
  <div class="vignette"></div>
  <div class="reticle" id="reticle"><i></i><i></i><i></i><div class="box"><b></b><b></b><b></b><b></b></div><div class="dot"></div></div>
  <div class="tag">TARGET LOCKED</div>

  <div class="layer" id="place"><div class="p"></div><div class="s"></div></div>
  <div class="layer" id="facts"></div>
  <div class="layer" id="tl"></div>
  <div class="layer" id="photo"><div class="print"><img alt=""><div class="cap"></div><div class="cr"></div></div></div>
  <div class="layer" id="hypos"><div class="hd">THEORIES ── 3つの説</div></div>
  <div class="layer" id="musing"><p></p></div>
  <div class="layer" id="question"><div class="qcard"><div class="lb">UNRESOLVED ── 未解決の問い</div><div class="q"></div><span class="stamp"></span><div class="no"></div></div></div>
  <div class="layer" id="outro"><div class="t">開かずの書庫</div><div class="r">AKAZU NO SHOKO</div><div class="c">続きは、プロフィールのリンクから</div></div>
  <div class="layer on" id="intro">
    <svg id="vault" viewBox="0 0 1000 1778" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <canvas id="dust"></canvas>
    <div class="hud tl" id="hudTL"></div>
    <div class="hud st" id="hudST"><span>SEAL</span><b></b><b></b><b></b><span class="w" id="hudW">LOCKED</span></div>
    <div class="hook" id="hook"></div>
  </div>
</div>

<div id="start">
  <div class="box">
    <h1>撮影モード</h1>
    <p>縦長 9:16・約25秒。<br>先に画面録画を始めてから「撮影開始」を押してください。<br>この案内は撮影中は表示されません。</p>
    <select id="pick"></select>
    <select id="len"><option value="25">約25秒（ショート）</option><option value="60">約60秒（長め）※台本がある記事のみ</option></select>
    <select id="bgm"><option value="pulse">BGM：鼓動（ドキュメンタリー風）</option><option value="box">BGM：オルゴール（不気味）</option><option value="quiet">BGM：静寂（これまで）</option></select>
    <label class="snd"><input type="checkbox" id="snd" checked> 音あり（効果音・BGM）</label>
    <button id="go" type="button">撮影開始</button>
  </div>
</div>
<button id="again" type="button">もう一度</button>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js" crossorigin="anonymous"></script>
<script>
/* ===== 台本（本番は記事データから自動で作る想定） ===== */
const FILMS = {

                 ["1909", "若きルーズベルトが、捜索に加わる"], ["1965", "硫化水素ガスで、4人が死亡", 1], ["2006", "ラジーナ兄弟が、現代の探査を投入"]],

              ["地質学説", "石灰岩が溶けてできた、自然の陥没。\nだが海岸の排水トンネルは説明できない", "議論中", "mid"],

  },
  nazca: {

    lng: -75.1303, lat: -14.6924, zoom: 13, pitch: 45, bearing: -15,
    hook: "砂漠に引かれた\n巨大な線と、動物たち。",
    place: "ナスカ", sub: "PERU ／ S 14.6924° W 75.1303°",
    facts: [["BC–", "紀元前後から、砂漠に描かれ始める"], ["THEORY", "暦説、儀礼の道説。決着していない"], ["2024", "AIの調査で、新たに303の地上絵"]],
    question: "線は、誰に見せる\nためのものだったのか。"

/* 珠が3つそろってから扉が開くまでの「溜め」（秒）。2.0秒以降の映像と音は、すべてこの分だけ後ろにずれる */
const HOLD = .9;

/* ===== 音（効果音・BGM） =====
   音の素材ファイルは使わず、ブラウザの Web Audio でその場で合成する（著作権の心配なし）。
   すべて本編の開始時刻 a0 からの秒数で予約するので、映像の動きとずれない。 */
const Sound = (() => {
  let ctx = null, master, rev, on = true;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  /* iPhone はマナーモード（消音スイッチ）だとブラウザの合成音が鳴らない。
     「再生用の音」として扱わせる：新しい Safari は audioSession、古い Safari は無音の audio 要素を流して切り替える */
  let unlockEl = null;
  function iosPlaybackMode() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (unlockEl) return;
    const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);   // 0.5秒の無音 WAV
    const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    unlockEl = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    unlockEl.loop = true; unlockEl.setAttribute("playsinline", "");
    unlockEl.play().catch(() => {});
  }
  function prime() {
    if (!on) return;
    iosPlaybackMode();
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .9;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      rev = ctx.createConvolver(); rev.buffer = impulse(3.4, 2.6);          // 石造りの書庫のような残響
      const rg = ctx.createGain(); rg.gain.value = .35; rev.connect(rg); rg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
  }
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function noise(sec) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function out(node, dry, wet) {
    const a = ctx.createGain(); a.gain.value = dry; node.connect(a); a.connect(master);
    const b = ctx.createGain(); b.gain.value = wet; node.connect(b); b.connect(rev);
  }
  function env(g, t, atk, peak, dec) {
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + atk); g.gain.exponentialRampToValueAtTime(.0001, t + atk + dec);
  }
  function noiseHit(t, type, freq, q, vol, dur) {
    const src = ctx.createBufferSource(); src.buffer = noise(dur + .1);
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); env(g, t, .004, vol, dur);
    src.connect(f); f.connect(g); out(g, 1, .5); src.start(t); src.stop(t + dur + .1);
  }
  function thump(t, f0, vol, dur) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .5, t + dur);
    env(g, t, .005, vol, dur); o.connect(g); out(g, 1, .4); o.start(t); o.stop(t + dur + .05);
  }
  /* BGM の部品 */
  function drone(t, len) {                      // 低く続く空気のうなり
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + 2.5);
    g.gain.setValueAtTime(.16, t + len - 3); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220; lp.Q.value = .7;
    [55, 55.35, 82.4].forEach(f => { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(t); o.stop(t + len); });
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .08; lg.gain.value = 90;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t); lfo.stop(t + len);
    lp.connect(g); out(g, .9, .4);
  }
  function pad(t, notes, dur, vol) {             // 暗い和音
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 1.8);
    g.gain.setValueAtTime(vol, t + dur - 1.4); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    notes.forEach(m => [0, -7, 7].forEach(c => { const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = midi(m); o.detune.value = c; o.connect(lp); o.start(t); o.stop(t + dur + .1); }));
    lp.connect(g); out(g, .7, .9);
  }
  function pluck(t, m, vol) {                    // ピアノのような単音
    const g = ctx.createGain(); env(g, t, .008, vol, 2.4);
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = midi(m); o.connect(g);
    const o2 = ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = midi(m) * 2;
    const g2 = ctx.createGain(); g2.gain.value = .15; o2.connect(g2); g2.connect(g);
    out(g, .6, 1); o.start(t); o2.start(t); o.stop(t + 2.6); o2.stop(t + 2.6);
  }
  /* 鼓動：低い2連打（ドクン、ドクン） */
  function heart(t, v) { thump(t, 62, .55 * v, .26); thump(t + .19, 54, .38 * v, .22); }
  /* 秒針のような刻み */
  function tickTock(t, v) { noiseHit(t, "highpass", 6500, 1, v, .02); }
  /* 不穏な弦（のこぎり波を重ね、こもらせてゆっくり立ち上げる） */
  function strings(t, notes, dur, vol) {
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 2.6);
    g.gain.setValueAtTime(vol, t + dur - 2); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 1.2;
    lp.frequency.setValueAtTime(380, t); lp.frequency.linearRampToValueAtTime(900, t + dur * .6); lp.frequency.linearRampToValueAtTime(500, t + dur);
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 5.2; vg.gain.value = 6; vib.connect(vg);   // 弦のビブラート
    notes.forEach(m => [-9, 0, 9].forEach(c => { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = midi(m); o.detune.value = c; vg.connect(o.detune); o.connect(lp); o.start(t); o.stop(t + dur + .1); }));
    lp.connect(g); out(g, .6, 1); vib.start(t); vib.stop(t + dur + .1);
  }
  /* オルゴール（基音＋少しずれた倍音、速い減衰） */
  function musicBox(t, m, vol) {
    const g = ctx.createGain(); env(g, t, .003, vol, 1.8);
    [[1, 1], [2.01, .35], [3.03, .18], [4.2, .08]].forEach(([r, v]) => {
      const o = ctx.createOscillator(), og = ctx.createGain(); o.frequency.value = midi(m) * r; o.detune.value = (Math.random() - .5) * 14;
      og.gain.value = v; o.connect(og); og.connect(g); o.start(t); o.stop(t + 2);
    });
    out(g, .55, 1.1);
  }
  function fadeOut(end) { master.gain.setValueAtTime(.9, end - 2.5); master.gain.linearRampToValueAtTime(.0001, end); }

  /* 効果音 */
  const SE = {
    latch(t) { thump(t, 90, .9, .35); noiseHit(t, "bandpass", 700, 1.2, .6, .18); noiseHit(t + .09, "bandpass", 1500, 3, .25, .08); },
    shimmer(t) { [2093, 2637, 3136].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; env(g, t + i * .06, .3, .022, 1.6); o.connect(g); out(g, .4, 1); o.start(t); o.stop(t + 2.3); }); },
    tick(t) { noiseHit(t, "highpass", 3200, 1, .18, .025); thump(t, 900, .05, .03); },        // ダイヤルのカチッ
    rise(t, dur) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = "sawtooth"; o2.type = "sine";
      o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(150, t + dur);
      o2.frequency.setValueAtTime(140, t); o2.frequency.exponentialRampToValueAtTime(440, t + dur);
      lp.type = "lowpass"; lp.frequency.setValueAtTime(200, t); lp.frequency.exponentialRampToValueAtTime(1800, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + dur * .9); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .25);
      o.connect(lp); o2.connect(lp); lp.connect(g); out(g, .9, .8);
      o.start(t); o2.start(t); o.stop(t + dur + .3); o2.stop(t + dur + .3);
    },
    seat(t) {                                                                               // 珠がはまる（澄んだキン＋重いコトッ）
      thump(t, 170, .55, .16);
      [1568, 2349, 3136].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; env(g, t, .002, [.12, .06, .03][i], .9); o.connect(g); out(g, .7, 1); o.start(t); o.stop(t + 1); });
    },
    clunk(t) { thump(t, 120, .5, .18); noiseHit(t, "bandpass", 1100, 2, .3, .06); },         // ダイヤルがそろう
    slide(t) {                                                                              // 重い扉が左右に開く
      thump(t, 55, .9, 1.6);
      const src = ctx.createBufferSource(); src.buffer = noise(1.8);
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = .8;
      f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(1800, t + 1.2);
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.45, t + .35); g.gain.exponentialRampToValueAtTime(.0001, t + 1.7);
      src.connect(f); f.connect(g); out(g, 1, .8); src.start(t); src.stop(t + 1.8);
    },
    creak(t) {                                    // 扉のきしみ＋開く風
      const o = ctx.createOscillator(); o.type = "sawtooth";
      for (let i = 0; i < 16; i++) o.frequency.setValueAtTime(58 + Math.random() * 55, t + i * .1);
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 950; bp.Q.value = 7;
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .15);
      g.gain.setValueAtTime(.28, t + 1.1); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
      const am = ctx.createOscillator(), ag = ctx.createGain(); am.type = "square"; am.frequency.value = 23; ag.gain.value = .1;
      am.connect(ag); ag.connect(g.gain);
      o.connect(bp); bp.connect(g); out(g, 1, .7); o.start(t); am.start(t); o.stop(t + 1.7); am.stop(t + 1.7);
      noiseHit(t + .2, "lowpass", 500, .5, .22, 1.4);
    },
    lock(t) { [1320, 1980].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; env(g, t + i * .12, .003, .1, .12); o.connect(g); out(g, 1, .3); o.start(t + i * .12); o.stop(t + i * .12 + .2); }); },
    swish(t) { noiseHit(t, "bandpass", 1800, .9, .16, .3); },                              // 札が去る風切り
    paper(t) { noiseHit(t, "highpass", 2500, .7, .2, .22); noiseHit(t + .05, "bandpass", 900, 1, .1, .15); },
    stamp(t) { thump(t, 70, 1, .4); noiseHit(t, "lowpass", 400, .7, .7, .12); },
    boom(t) { thump(t, 48, .8, 2.2); noiseHit(t, "lowpass", 180, .5, .35, 1.8); },
  };
  return {
    setOn(v) { on = v; },
    prime,
    /* 本編の開始時に呼ぶ。台本の秒数どおりに BGM と効果音を予約する */
    /* style：BGM の種類（pulse＝鼓動／box＝オルゴール／quiet＝静寂） */
    schedule(long, style = "pulse") {
      if (!on || !ctx) return;
      const a = ctx.currentTime + .05, b = a + HOLD;   // a：冒頭（〜2秒）の基準、b：扉が開いて以降の基準
      const len = long ? 61 : 27;                      // 扉が開いてからの長さ（秒、b 基準）
      const Q = long ? 50.5 : 20.0;                    // 「未解決の問い」が出る時刻（b 基準）

      /* --- 効果音（BGM の種類に関係なく共通） --- */
      for (let k = .3; k < 1.55; k += .09 + Math.random() * .05) SE.tick(a + k);   // ダイヤルが回るカチカチ
      [1.2, 1.4, 1.6].forEach(sec => SE.clunk(a + sec));                           // ダイヤルが1つずつそろう
      [1.42, 1.62, 1.82].forEach(sec => SE.seat(a + sec));                         // 珠が受け口にはまる
      SE.latch(a + 1.85);                                                          // 封印が解け、ボルトが外れる
      SE.rise(a + 1.9, HOLD + .3);                                                 // 溜め
      SE.shimmer(b + 2.0); SE.slide(b + 2.2); SE.lock(b + 7.9);
      if (!long) {
        [9.0, 12.5, 16.0].forEach(sec => SE.paper(b + sec));                       // 札が入る
        [12.0, 15.5, 19.3].forEach(sec => SE.swish(b + sec));                      // 札が去る
        SE.stamp(b + 20.75); SE.boom(b + 23.5);
      } else {
        [9.2, 11.6, 14.0, 16.4, 18.8, 21.2].forEach(sec => SE.paper(b + sec));   // 年表
        SE.paper(b + 24.6);                                                        // 写真
        [32.0, 36.6, 41.2].forEach(sec => { SE.paper(b + sec); SE.stamp(b + sec + .55); });  // 3つの説と判子
        SE.shimmer(b + 45.0);                                                      // ひとこと
        SE.stamp(b + 51.25); SE.boom(b + 56.5);
      }

      /* --- BGM --- */
      if (style === "quiet") {                         // 静寂：低いうなり・暗い和音・まばらな単音（これまでの BGM）
        drone(a, len + .5 + HOLD);
        const chords = [[57, 60, 64], [53, 57, 60], [52, 55, 59], [57, 60, 64], [50, 53, 57], [53, 57, 60], [52, 55, 59], [57, 60, 64]];
        for (let i = 0, t = 2.2; t < len - 2; i++, t += 7) pad(b + t, chords[i % chords.length], 7.6, .05);
        const mel = [76, 72, 74, 71, 72, 69, 67, 64, 69, 71, 72, 74, 76, 72, 69, 67, 64, 62, 64, 69];
        for (let i = 0, t = 8.2; t < len - 4; i++, t += 2.1) pluck(b + t, mel[i % mel.length], .07);

/* ===== 冒頭：封印された書庫の金庫扉（モーショングラフィックス） =====

const Intro = (() => {
  const C = { x: 500, y: 850 }, PA = "#e9dcbc", GO = "#e0b25a", RD = "#ff5a4a";

            hudST: document.getElementById("hudST"), seals: [...document.querySelectorAll("#hudST b")], word: document.getElementById("hudW"),

    // 引きの一文を1文字ずつに分ける

    hook.innerHTML = [...f.hook].map(c => c === "\n" ? "<br>" : `<span class="ch">${c}</span>`).join("");
    chars = [...hook.querySelectorAll(".ch")].map((el, i) => ({ el, i, dx: (Math.random() - .5) * 120, dy: -60 - Math.random() * 120, rot: (Math.random() - .5) * 40 }));
    // 埃

    built = true;
  }

  function hudText(t) {   // 左上：記録番号と座標をタイプ

    const n = Math.floor(clamp((t - .3) / 1.1) * lines.join("").length);

    const BEND = [[150, -40], [230, 40], [-230, 40]];   // 弧のふくらみ（上・右下・左下）
    e.orbs.forEach((o, i) => {

      const cx = (sx + ex) / 2 + BEND[i][0], cy = (sy + ey) / 2 + BEND[i][1];

      o.setAttribute("opacity", 1); o.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
      e.srings[i].setAttribute("stroke", seated ? RD : PA); e.srings[i].setAttribute("filter", seated ? "url(#glow)" : "");
    });

    e.emblem.setAttribute("fill", t >= UNSEAL ? RD : "none"); e.emblem.setAttribute("filter", t >= UNSEAL ? "url(#glow)" : "");
    const pq = clamp((t - UNSEAL) / .8);
    e.pulse.setAttribute("r", (60 + 470 * outC(pq)).toFixed(1)); e.pulse.setAttribute("opacity", t >= UNSEAL ? (.9 * (1 - pq)).toFixed(3) : 0);
    const p2 = clamp((t - UNSEAL - .45) / .8);                                  // 溜め：2回目の光の輪
    e.pulse2.setAttribute("r", (60 + 470 * outC(p2)).toFixed(1)); e.pulse2.setAttribute("opacity", t >= UNSEAL + .45 ? (.8 * (1 - p2)).toFixed(3) : 0);
    const beat = t >= UNSEAL && t < 2.2 + HOLD ? .5 + .5 * Math.sin((t - UNSEAL) * 14) : 0;   // 溜め：三角形が脈打つ

    e.edges.forEach(g => g.setAttribute("opacity", (clamp((t - 2.05 - HOLD) / .2) * (1 - clamp((t - 3.2 - HOLD) / .4))).toFixed(3)));
    const op = inOut4(clamp((t - 2.2 - HOLD) / 1.3));

    e.cam.setAttribute("transform", `translate(${C.x} ${C.y}) scale(${z}) translate(${-C.x} ${-C.y})`);

    // 引きの一文：ぼかしから1文字ずつ → 開くと舞い上がって消える
    chars.forEach(c => {
      const a = outC(clamp((t - .25 - c.i * .035) / .55)), ex = clamp((t - 2.15 - HOLD - c.i * .012) / .8), ee = outC(ex);
      c.el.style.opacity = (a * (1 - ex)).toFixed(3);

      c.el.style.transform = `translate(${(c.dx * ee).toFixed(1)}px, ${((1 - a) * 14 + c.dy * ee).toFixed(1)}px) rotate(${(c.rot * ee).toFixed(1)}deg)`;
    });
    // 埃：ふだんはゆっくり漂い、扉が開くと中心から外へ吹き飛ぶ

    },
  };
})();

  Intro.start(t0);
  await at(2400); map.easeTo({ center: [f.lng, f.lat], zoom: homeZoom(), duration: 2400, easing: t => 1 - Math.pow(1 - t, 3) });
  // 4.8s 現場へ降りる
  await at(4800); map.easeTo({ center: [f.lng, f.lat], zoom: f.zoom - .5, pitch: f.pitch, bearing: f.bearing, duration: 3300, easing: ease3 });
  // 7.6s 照準と地名
  await at(7600); $("reticle").classList.add("on"); $("place").classList.add("on");
  // 8.2s 以降、ゆっくり回り込む
  await at(8200); map.easeTo({ bearing: f.bearing + (L ? 90 : 35), zoom: f.zoom, duration: L ? 42000 : 12000, easing: t => t });
  if (L) return playLong(f, at);
  // 9.0s / 12.5s / 16.0s 事実
  const facts = $("facts").children;
  // 札は1枚ずつ：入る → 約3秒見せる → 右へ去る → 次の札
  await at(9000);  facts[0].classList.add("on");
  await at(12000); facts[0].classList.add("out");
  await at(12500); facts[1].classList.add("on");
  await at(15500); facts[1].classList.add("out");
  await at(16000); facts[2].classList.add("on");
  await at(19300); facts[2].classList.add("out");
  // 20.0s 未解決の問い
  await at(20000); $("question").classList.add("on");
  // 23.5s ロゴ
  await at(23500); $("outro").classList.add("on");
  // 26.5s 終了
  await at(26500); $("again").style.display = "block";
}

/* 約60秒版の後半：年表 → 古い写真 → 3つの説 → ひとこと → 問い → ロゴ */
async function playLong(f, at) {
  const rows = [...$("tl").children];
  // 9.2s〜 年表を2.4秒ごとに積み上げる（4件を超えたら古いものから消す）
  for (let i = 0; i < rows.length; i++) {
    await at(9200 + i * 2400); rows[i].classList.add("on");
    if (i >= 4) rows[i - 4].classList.add("gone"), setTimeout(() => rows[i - 4].style.display = "none", 600);
  }
  await at(23800); $("tl").style.opacity = 0; $("place").classList.remove("on");
  // 24.6s 古い写真
  await at(24600); $("photo").classList.add("on");
  await at(30400); $("photo").classList.remove("on");
  // 31s〜 3つの説（判子つき）
  await at(31000); $("hypos").classList.add("on");
  const hy = $("hypos").querySelectorAll(".hy");
  await at(32000); hy[0].classList.add("on");
  await at(36600); hy[1].classList.add("on");
  await at(41200); hy[2].classList.add("on");
  // 45s ひとこと
  await at(45000); $("hypos").classList.remove("on"); $("musing").classList.add("on");
  // 50.5s 未解決の問い
  await at(50500); $("musing").classList.remove("on"); $("question").classList.add("on");
  // 56.5s ロゴ
  await at(56500); $("outro").classList.add("on");
  await at(60000); $("again").style.display = "block";
}

if (params.has("auto")) { document.getElementById("start").style.display = "none"; play(); }
</script>
